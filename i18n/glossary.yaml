# Agreed words per language. `i18n:check` follows the avoid and keep words; `i18n:translate` puts the
# terms that occur in a batch in the model's prompt. See docs/i18n.md.
#
# approved: a person sets this to true once the glossary may be used to translate; `i18n:translate`
# refuses until then. Unconfirmed items below are marked in their notes.
approved: true

terms:
  # Left as they are in every language.
  - term: Homey
    meaning: The smart-home hub brand and the hub itself, as users call it.
    keep: true
  - term: Homey Pro
    meaning: The Homey hub model Tiledash connects to.
    keep: true
  - term: Advanced Flow
    meaning: Homey's visual automation editor with free-form blocks; a product feature name.
    keep: true
  - term: Flow
    meaning: A Homey automation (when this happens, then do that); a product feature name.
    keep: true
  - term: Insights
    meaning: Homey's feature that logs capability values over time and draws graphs; a product feature name.
    keep: true
  - term: Tiledash
    meaning: This product's name.
    keep: true
  - term: Pro
    meaning: The paid Tiledash plan.
    keep: true
  - term: Free
    meaning: The free Tiledash plan.
    keep: true
    # The plain adjective, not the plan.
    except:
      - editor.dashboardSettings.freePlacement
      - account.mapTiles.aboutMapTiler
      - account.mapTiles.aboutOpenFreeMap
      - account.mapTiles.aboutStadia
      # The community site's phone menu: costs nothing to try (63.4).
      - showcase.site.menuNote
  - term: Logic
    meaning: Homey's variables (Homey Logic), as named in the Homey app; kept as it is (the user, 2026-10-17).
    keep: true

  - term: dashboard
    meaning: A screen of tiles that shows and controls the house, made by the user.
    nl: { preferred: dashboard }
    de: { preferred: Dashboard }
    es:
      preferred: dashboard
      avoid: panel
      notes: Never "panel" for a dashboard; "panel" is only part of "panel de pared" (wall panel).
    fr: { preferred: tableau de bord }
    nb: { preferred: dashbord }
    sv: { preferred: dashboard }
    da: { preferred: dashboard }
  - term: tile
    meaning: One rectangle on a dashboard that shows one device, value or widget.
    # Map tiles are map images, not dashboard tiles.
    # Floor tiles are a floor's finish on a floor plan.
    except: [account.mapTiles.*, account.credits.mapsText, floorplans.editor.finish]
    nl: { preferred: tegel }
    de: { preferred: Kachel, avoid: Fliese }
    es: { preferred: mosaico, avoid: azulejo }
    fr: { preferred: tuile }
    nb:
      preferred: [flis, fliser]
    sv:
      preferred: [ruta, rutor, rutan]
    da:
      preferred: [felt, felter]
  - term: credit
    meaning: What generating a house picture in Tiledash costs (35.9), one each, bought in packs.
    nl: { preferred: credit }
    de: { preferred: Credit }
    es: { preferred: crédito }
    fr: { preferred: crédit }
    nb: { preferred: kreditt }
    sv: { preferred: kredit }
    da: { preferred: kredit }
  - term: widget
    meaning: A custom or built-in piece of content (a clock, a graph, a button) shown in a tile.
    nl: { preferred: widget }
    de: { preferred: Widget }
    es: { preferred: widget }
    fr: { preferred: widget }
    nb: { preferred: widget }
    sv: { preferred: widget }
    da: { preferred: widget }
  - term: device
    meaning: A physical or virtual thing paired with Homey (a lamp, a thermostat, a sensor).
    except: [code.partials.hintIcon, code.partials.renderingNote]
    nl: { preferred: apparaat, avoid: toestel }
    de: { preferred: Gerät }
    es: { preferred: dispositivo, avoid: aparato }
    fr: { preferred: appareil, avoid: dispositif }
    nb: { preferred: enhet }
    sv: { preferred: enhet }
    da: { preferred: enhed }
  - term: zone
    meaning: A room or area of the house that groups devices (living room, upstairs, garden).
    # An electricity market's price area, not a Homey zone.
    except: [devices.dayAhead.zoneLabel, devices.dayAhead.zoneField]
    nl: { preferred: zone }
    de: { preferred: Zone }
    es: { preferred: zona }
    fr: { preferred: zone }
    nb: { preferred: sone }
    sv: { preferred: zon }
    da: { preferred: zone }
  - term: mood
    meaning: A Homey preset that sets several devices to a remembered state at once (Homey's own word).
    nl:
      preferred: sfeer
      notes: Unconfirmed, check the word in the Homey app.
    de:
      preferred: Stimmung
      notes: Unconfirmed, check the word in the Homey app.
    es:
      preferred: ambiente
      notes: Unconfirmed, check the word in the Homey app.
    fr:
      preferred: ambiance
      notes: Unconfirmed, check the word in the Homey app.
    nb:
      preferred: stemning
      notes: 'Proposed 2026-11-08, unconfirmed: check the word in the Homey app.'
    sv:
      preferred: stämning
      notes: 'Proposed 2026-11-08, unconfirmed: check the word in the Homey app.'
    da:
      preferred: stemning
      notes: 'Proposed 2026-11-08, unconfirmed: check the word in the Homey app.'
  - term: scene
    meaning: A saved set of device states that a person starts with one tap.
    nl: { preferred: scène }
    de: { preferred: Szene }
    es: { preferred: escena }
    fr: { preferred: scène }
    nb: { preferred: scene }
    sv: { preferred: scen }
    da: { preferred: scene }
  - term: capability
    meaning: One thing a device can report or be told to do (on or off, dim level, temperature, power).
    nl:
      preferred: eigenschap
      notes: Unconfirmed, check the word in the Homey app.
    de:
      preferred: Funktion
      notes: Unconfirmed, check the word in the Homey app.
    es:
      preferred: función
      notes: Unconfirmed, check the word in the Homey app.
    fr:
      preferred: fonction
      notes: Unconfirmed, check the word in the Homey app.
    nb:
      preferred: funksjon
      notes: 'Proposed 2026-11-08, unconfirmed: check the word in the Homey app.'
    sv:
      preferred: funktion
      notes: 'Proposed 2026-11-08, unconfirmed: check the word in the Homey app.'
    da:
      preferred: funktion
      notes: 'Proposed 2026-11-08, unconfirmed: check the word in the Homey app.'
  - term: dim level
    meaning: How bright a dimmable light is, from 0 to 100 percent.
    nl: { preferred: dimniveau }
    de: { preferred: Dimmlevel }
    es: { preferred: intensidad de la luz }
    fr: { preferred: intensité lumineuse }
    nb: { preferred: dimmenivå }
    sv: { preferred: dimnivå }
    da: { preferred: lysniveau }
  - term: on / off
    meaning: The two states of a switch, light or socket; also the labels of its toggle.
    nl: { preferred: aan / uit }
    de: { preferred: ein / aus }
    es: { preferred: encendido / apagado }
    fr: { preferred: allumé / éteint }
    nb: { preferred: på / av }
    sv: { preferred: på / av }
    da: { preferred: til / fra }
  - term: wall panel
    meaning: A screen fixed to a wall (often a tablet) that shows a dashboard all day.
    nl: { preferred: wandpaneel }
    de: { preferred: Wandpanel }
    es: { preferred: panel de pared }
    fr: { preferred: écran mural }
    nb: { preferred: veggpanel }
    sv: { preferred: väggpanel }
    da: { preferred: vægpanel }
  - term: paired screen
    meaning: A screen (a tablet, an e-ink panel) linked to a Tiledash account with a pairing code.
    nl: { preferred: gekoppeld scherm }
    de: { preferred: gekoppelter Bildschirm }
    es: { preferred: pantalla vinculada }
    fr: { preferred: écran associé, avoid: écran apparié }
    nb: { preferred: tilkoblet skjerm }
    sv: { preferred: kopplad skärm }
    da: { preferred: tilknyttet skærm }
  - term: share link
    meaning: A web address that lets someone see a dashboard without an account.
    nl: { preferred: deellink }
    de: { preferred: Freigabelink }
    es: { preferred: enlace para compartir }
    fr: { preferred: lien de partage }
    nb: { preferred: delingslenke }
    sv: { preferred: delningslänk }
    da: { preferred: delingslink }
  - term: theme
    meaning: The colours, fonts and look of a dashboard.
    nl: { preferred: thema }
    de: { preferred: Design, avoid: Thema }
    es: { preferred: tema }
    fr: { preferred: thème }
    nb: { preferred: tema }
    sv: { preferred: tema }
    da: { preferred: tema }
  - term: community
    meaning: The place where users share widgets, themes and dashboards with each other.
    nl: { preferred: community }
    de: { preferred: Community }
    es: { preferred: comunidad }
    fr: { preferred: communauté }
    nb:
      preferred: Community
      notes: The name of a place in the app, so always with a capital (the user, 2026-11-08).
    sv:
      preferred: Community
      notes: The name of a place in the app, so always with a capital (the user, 2026-11-08).
    da:
      preferred: Community
      notes: The name of a place in the app, so always with a capital (the user, 2026-11-08).
  # The page with everything a person makes (45; the translators' choices, 2026-10-26), named as
  # a place in the app, so with a capital.
  - term: Workshop
    meaning: The page in the sidebar with the widgets, partials, themes and 3D models a person made.
    nl: { preferred: Werkplaats }
    de: { preferred: Werkstatt }
    es: { preferred: Taller }
    fr: { preferred: Atelier }
    nb: { preferred: Verksted }
    sv: { preferred: Verkstad }
    da: { preferred: Værksted }
  # Models of real products on floor plans and in the community (F23; the translators' choices,
  # 2026-10-26).
  - term: model
    meaning: A 3D model of a piece of furniture or a device, for floor plans; a user's own or one from the community.
    nl: { preferred: model }
    de: { preferred: Modell }
    es: { preferred: modelo }
    fr: { preferred: modèle }
    nb: { preferred: modell }
    sv: { preferred: modell }
    da: { preferred: model }
  - term: item type
    meaning: What a model or catalogue piece is (Sofas and armchairs, Audio and video), whichever room it stands in; shown as "Type".
    nl: { preferred: type }
    de: { preferred: Typ }
    es: { preferred: tipo }
    fr: { preferred: type }
    nb: { preferred: type }
    sv: { preferred: typ }
    da: { preferred: type }
  - term: suggested room
    meaning: The room a model is meant for, or none (any room); a user's choice, not a proposal.
    nl:
      preferred: aanbevolen kamer
      notes: Not "voorgestelde kamer", as voorstellen is "propose".
    de:
      preferred: empfohlener Raum
      notes: Not "vorgeschlagen", as vorschlagen is "propose".
    es: { preferred: habitación sugerida }
    fr: { preferred: pièce suggérée }
    nb:
      preferred: anbefalt rom
      notes: 'Not "foreslått rom", as foreslå is "propose".'
    sv:
      preferred: rekommenderat rum
      notes: 'Not "föreslaget rum", as föreslå is "propose".'
    da:
      preferred: anbefalet rum
      notes: 'Not "foreslået rum", as foreslå is "propose".'
  - term: propose
    meaning: To suggest a new item type or room for an admin to review.
    # Dutch splits the verb there ("stel meer voor").
    except: [floorplans.modelProducts.proposedLimit]
    nl: { preferred: voorstellen }
    de: { preferred: vorschlagen }
    es:
      preferred: proponer
      notes: A type is masculine and a room feminine; one text covers both, so use "propuesta" or wording that needs no gender.
    fr:
      preferred: proposer
      notes: A type is masculine and a room feminine; one text covers both, so use "ajout" or wording that needs no gender.
    nb: { preferred: foreslå }
    sv: { preferred: föreslå }
    da: { preferred: foreslå }
  - term: brand
    meaning: The maker of the real product a model stands for (Sonos, IKEA); brand names themselves stay as they are.
    nl: { preferred: merk }
    de: { preferred: Marke }
    es: { preferred: marca }
    fr: { preferred: marque }
    nb: { preferred: merke }
    sv: { preferred: märke }
    da: { preferred: mærke }
  - term: real product
    meaning: The product a model stands for, by brand and product name (Sonos Arc Ultra).
    nl: { preferred: echt product }
    de: { preferred: echtes Produkt }
    es: { preferred: producto real }
    fr: { preferred: produit réel }
    nb: { preferred: ekte produkt }
    sv: { preferred: riktig produkt }
    da: { preferred: rigtigt produkt }
  - term: how it looks
    meaning: A model's or piece's description of its materials, colours and shapes, used to draw pictures of floor plans.
    # How a widget looks, not a model's description.
    except: [editor.widgetPicker.ownNone, community.listing.descriptionExample]
    nl: { preferred: hoe het eruitziet }
    de: { preferred: Aussehen }
    es: { preferred: aspecto }
    fr: { preferred: apparence }
    nb: { preferred: utseende }
    sv: { preferred: utseende }
    da: { preferred: udseende }
  - term: appliance
    meaning: A household machine (fridge, washing machine); the item type, not a Homey device.
    # The appliance widget's settings.
    except: [code.richFields.*]
    nl:
      preferred: huishoudapparaat
      notes: Keep it apart from device, which is apparaat.
    de:
      preferred: Haushaltsgerät
      notes: Keep it apart from device, which is Gerät.
    es: { preferred: electrodoméstico }
    fr: { preferred: électroménager }
    nb:
      preferred: husholdningsapparat
      notes: 'Keep it apart from device, which is enhet.'
    sv:
      preferred: hushållsapparat
      notes: 'Keep it apart from device, which is enhet.'
    da:
      preferred: husholdningsapparat
      notes: 'Keep it apart from device, which is enhed.'
  - term: admin
    meaning: Someone who runs Tiledash and reviews what users share; not the owner of a Homey.
    # A Homey's own admin rights, and the Admin area's name.
    except: [login.*, shell.*]
    nl: { preferred: beheerder }
    de: { preferred: Admin }
    es: { preferred: administrador }
    fr: { preferred: administrateur }
    nb: { preferred: administrator }
    sv: { preferred: administratör }
    da: { preferred: administrator }
  - term: energy meter
    meaning: A device that measures electricity use or solar production of the house.
    nl: { preferred: energiemeter }
    de: { preferred: Energiezähler }
    es: { preferred: contador de energía, avoid: metro de energía }
    fr: { preferred: compteur d'énergie }
    nb: { preferred: energimåler }
    sv: { preferred: energimätare }
    da: { preferred: energimåler }
  - term: reading
    meaning: One measured value of a sensor or meter at a moment (a temperature, a kWh count).
    # The verb ("Reading who lives here…"), not a measured value.
    except:
      - editor.peopleValues.loadingTitle
      # "reading order", the order a page is read in.
      - editor.sizeScope.followsPhone
      # Reading a backup file or a Homey's devices.
      - account.configImport.syncingTitle
      - account.configImport.syncingDetail
      - account.importDialog.reading
      - editor.timelineValues.loadingTitle
      # A meter's register reading: Zählerstand, meterstand, index du compteur.
      - widgets.builtin.theMeterSReading
    nl: { preferred: meetwaarde }
    de: { preferred: Messwert }
    es: { preferred: lectura }
    fr: { preferred: mesure, avoid: lecture }
    nb: { preferred: måleverdi }
    sv: { preferred: mätvärde }
    da: { preferred: måleværdi }
  # Added 2026-10-17 from what the translators chose for the login pages (approved by the user).
  - term: plan
    meaning: A Tiledash subscription level (Free or Pro) and what it allows.
    # Claude's and ChatGPT's own plans, in the steps to connect them.
    # Floor plans (drawings of the house) are a term of their own, below.
    except: [
        shell.aiSetup.claude1,
        shell.aiSetup.chatgpt1,
        floorplans.*,
        shell.names.floorPlans,
        # The floor planner's tour (59.7): the plan being drawn.
        shell.tour.planSafeBody,
        shell.tour.planTourNoPlan,
        shell.tour.planOfferText,
        shell.tour.planEndTitle,
        shell.tour.tourFloorPlan,
        account.plans.rowFloorPlans,
        account.plans.rowFloorPlans3d,
        account.plans.groupFloorPlans,
        # The community site's 3D furniture page: for floor plans (63.4).
        showcase.site.aboutModels,
        # What goes when a Homey is removed (its floor plans among it).
        account.removeHomey.body,
        # A credit spent on a picture of a floor plan (F20).
        account.houseCredits.spendFloorPlan,
        # A Floor plan tile's live plan, beside its picture (F20).
        editor.configSections.live,
        editor.widgetSettings.leadLive,
        # A Floor plan tile's picture setting and its kind in the code editor (F20).
        editor.floorPlanPictureSetting.*,
        code.settingViews.readsFloorPlanPicture,
        # Where a 3D model goes in the Community (F10.4): on your floor plans.
        community.dialogs.installLicence,
        # What models are for, on the Community's overview and its pages (33.6): your floor plans.
        community.sections.kindNote,
        community.sections.description,
        community.dialogs.whereModel,
        community.installed.notOnPlan,
        community.item.licenceHint,
        # Floor plans an owner shares with the people on their Homey (47).
        account.people.floorPlans,
        account.people.tabShares,
        account.people.leadShares,
        shell.sidebar.shared.floorPlan,
        shell.sidebar.shared.listLabel,
        # The Workshop's models are for floor plans (45).
        code.workshop.description,
        code.workshop.descriptionFree,
        code.workshop.modelUse,
        code.workshop.newModelText,
        community.manage.modelUnused,
        community.pages.installedModel,
        account.configImport.group,
        account.shareDialog.floorPlans,
        editor.floorPlanSetting.*,
        editor.widgetPicker.everyLevelDetail,
        code.kindPicker.floorplan,
        code.settingViews.kind,
        code.settingViews.newLabel,
        # Furniture an AI assistant designs for your floor plans (F18).
        account.aiAssistants.allow4,
        account.aiAssistants.allow7,
        login.consent.widgetsAllow7,
        account.aiAssistants.lead,
        login.consent.widgetsAllow4,
        code.previewLink.fineModel,
        # Settings › Floor plans (40): its name, its line and what its menu item says.
        account.settings.floorPlans,
        account.settings.floorPlansAbout,
        account.settingsPage.floorPlanCount,
        # Pictures made for your houses and floor plans, in the picture library.
        account.pictures.deleteMadeFor,
        account.pictures.emptyText,
        account.pictures.useFloorPlan,
        account.settings.picturesAbout,
        viewer.pictures.originFloorPlan,
        # An AI assistant changing your floor plans in drafts, and reviewing those drafts.
        account.aiAssistants.allow10,
        login.consent.widgetsAllow10,
        code.floorPlanDraftPreview.*,
        # The Floor plan widget, its settings and its room elements.
        widgets.builtin.aSliderUnderThePlanTo,
        widgets.builtin.configureActionsInTheFloorPlanner,
        widgets.builtin.floorPlan,
        widgets.builtin.livePlan,
        widgets.builtin.ringsWhereATapReachesA,
        widgets.builtin.softIsTheFloorPlanS,
        widgets.builtin.useFloorPlanActions,
        widgets.builtin.whatTheTileStartsOnThe,
        widgets.elements.planChoose,
        widgets.elements.planChooseText,
        widgets.elements.planGone,
        widgets.elements.planPaused,
        widgets.elements.planShowLive,
        widgets.elements.roomNoChoices,
        widgets.elements.roomNotOnPlan,
        widgets.elements.roomOnPlan,
        widgets.elements.roomSavedNote,
        widgets.elements.roomTickAll,
      ]
    nl: { preferred: plan, notes: '"abonnement" only where the English says subscription.' }
    de: { preferred: Tarif }
    es: { preferred: plan }
    fr: { preferred: forfait }
    nb:
      preferred: [abonnement, plan]
      notes: 'Not "plan" where it could be read as the floor plan (plantegning).'
    sv:
      preferred: [abonnemang, plan]
    da:
      preferred: [abonnement, plan]
